<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Player Dial — NowssB</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    color: #e8e8e8;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 20;
  }
  .back {
    width: 38px;
    height: 38px;
    background: #fff;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: #000;
    font-weight: 500;
  }
  .title {
    font-size: 13px;
    letter-spacing: 3.5px;
    font-weight: 500;
    opacity: 0.75;
  }
  .dial-wrap {
    position: relative;
    width: min(86vw, 340px);
    height: min(86vw, 340px);
  }
  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .outer-ring {
    fill: none;
    stroke: #1f1f1f;
    stroke-width: 18;
  }
  .knurl {
    fill: none;
    stroke: #2c2c2c;
    stroke-width: 1.2;
    stroke-dasharray: 2.8 3.6;
  }
  .ticks line {
    stroke: #3a3a3a;
    stroke-width: 1.4;
  }
  .ticks .major {
    stroke: #5e5e5e;
    stroke-width: 2;
  }
  .icon {
    fill: none;
    stroke: #a8b8d0;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.5;
    transition: opacity 0.18s, stroke 0.18s, filter 0.18s;
    cursor: pointer;
  }
  .icon.active {
    opacity: 1;
    stroke: #e8f0ff;
    filter: drop-shadow(0 0 7px rgba(180, 210, 255, 0.75));
  }
  .center-btn {
    fill: #0c0c0c;
    stroke: #3a3a3a;
    stroke-width: 1.4;
  }
  .center-gear {
    fill: none;
    stroke: #c0c8d8;
    stroke-width: 1.55;
  }
  .value-badge {
    fill: #111;
    stroke: #333;
    stroke-width: 1;
  }
  .value-text {
    font-size: 15px;
    font-weight: 600;
    fill: #e8e8e8;
    text-anchor: middle;
    dominant-baseline: middle;
    letter-spacing: 0.4px;
  }
  .mode-label {
    position: absolute;
    bottom: -52px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 11px;
    letter-spacing: 2.2px;
    color: #555;
    text-transform: uppercase;
  }
  .mode-label span {
    color: #bbb;
  }
  .hint {
    position: absolute;
    bottom: 32px;
    font-size: 11px;
    color: #3a3a3a;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="back">←</div>
  <div class="title">PLAYER</div>
</div>

<div class="dial-wrap" id="dial">
  <svg viewBox="0 0 320 320" id="svg">
    <!-- Outer knurled ring -->
    <circle cx="160" cy="160" r="149" class="outer-ring"/>
    <circle cx="160" cy="160" r="149" class="knurl"/>

    <!-- Rotating ticks -->
    <g id="rotator" transform="rotate(0 160 160)">
      <g id="ticks"></g>
    </g>

    <!-- Icons (static positions) -->
    <!-- VOICE top -->
    <g class="icon" data-mode="VOICE" transform="translate(160, 48)">
      <path d="M-7 0 L-3.5 -5.5 L3.5 -5.5 L7 0 L3.5 5.5 L-3.5 5.5 Z"/>
      <path d="M-2.5 -1.5 L2.5 -1.5 M-2.5 1.5 L2.5 1.5" stroke-width="1.3"/>
    </g>

    <!-- VOLUME left -->
    <g class="icon" data-mode="VOLUME" transform="translate(48, 160)">
      <path d="M-6 -4 L-2 -4 L4 -9 L4 9 L-2 4 L-6 4 Z"/>
      <path d="M7 -3 Q11 0 7 3" stroke-width="1.5"/>
    </g>

    <!-- EQ top-right -->
    <g class="icon" data-mode="EQ" transform="translate(252, 78)">
      <path d="M-8 4 L-8 -4 M-3 6 L-3 -6 M2 2 L2 -2 M7 5 L7 -5"/>
    </g>

    <!-- SPEED bottom-left -->
    <g class="icon" data-mode="SPEED" transform="translate(72, 252)">
      <circle cx="0" cy="0" r="9" stroke-width="1.5"/>
      <path d="M0 0 L5 -6" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="1.6" fill="#a8b8d0"/>
    </g>

    <!-- LOOP right -->
    <g class="icon" data-mode="LOOP" transform="translate(252, 160)">
      <path d="M-6 -4 A8 8 0 1 1 -6 4" stroke-width="1.7"/>
      <path d="M-8 1 L-4 4 L-1 0" stroke-width="1.5"/>
    </g>

    <!-- REPS bottom-right -->
    <g class="icon" data-mode="REPS" transform="translate(230, 230)">
      <path d="M-5 -5 A7 7 0 1 1 -5 5" stroke-width="1.6"/>
      <path d="M-7 0 L-3 3 L0 -1" stroke-width="1.4"/>
      <path d="M5 5 A7 7 0 1 1 5 -5" stroke-width="1.6"/>
      <path d="M7 0 L3 -3 L0 1" stroke-width="1.4"/>
    </g>

    <!-- Center button -->
    <rect x="116" y="136" width="88" height="48" rx="24" class="center-btn"/>
    <g class="center-gear" transform="translate(160, 160)">
      <circle cx="0" cy="0" r="9" stroke-width="1.5"/>
      <path d="M0 -13 L2 -9 L-2 -9 Z M0 13 L2 9 L-2 9 Z
               M13 0 L9 2 L9 -2 Z M-13 0 L-9 2 L-9 -2 Z
               M9 -9 L7 -5 L5 -7 Z M-9 9 L-7 5 L-5 7 Z
               M9 9 L7 5 L5 7 Z M-9 -9 L-7 -5 L-5 -7 Z"/>
    </g>

    <!-- Value badge -->
    <rect x="134" y="216" width="52" height="28" rx="5" class="value-badge"/>
    <text x="160" y="231" class="value-text" id="valueText">7×</text>
  </svg>

  <div class="mode-label" id="modeLabel">
    <span>SPEED</span> · VOICE · EQ · LOOP · REPS · VOLUME
  </div>
</div>

<div class="hint">drag the ring to wind · tap icons to switch mode</div>

<script>
const modes = {
  SPEED:  { min: 0.5, max: 12, step: 0.5, unit: "×", decimals: 1 },
  VOLUME: { min: 0,   max: 100, step: 5,   unit: "%", decimals: 0 },
  LOOP:   { min: 0,   max: 50,  step: 1,   unit: "",  decimals: 0 },
  REPS:   { min: 1,   max: 30,  step: 1,   unit: "",  decimals: 0 },
  EQ:     { min: -12, max: 12,  step: 1,   unit: "dB", decimals: 0 },
  VOICE:  { min: -6,  max: 6,   step: 0.5, unit: "",  decimals: 1 }
};

let currentMode = "SPEED";
let values = { SPEED: 7, VOLUME: 70, LOOP: 0, REPS: 8, EQ: 0, VOICE: 0 };
let angle = 0;
let isDragging = false;
let lastAngle = 0;

const rotator = document.getElementById("rotator");
const valueText = document.getElementById("valueText");
const modeLabel = document.getElementById("modeLabel");
const dial = document.getElementById("dial");

// Build ticks
const ticksGroup = document.getElementById("ticks");
for (let i = 0; i < 60; i++) {
  const a = (i / 60) * Math.PI * 2 - Math.PI / 2;
  const major = i % 5 === 0;
  const r1 = major ? 116 : 121;
  const r2 = 133;
  const x1 = 160 + Math.cos(a) * r1;
  const y1 = 160 + Math.sin(a) * r1;
  const x2 = 160 + Math.cos(a) * r2;
  const y2 = 160 + Math.sin(a) * r2;
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("x1", x1);
  line.setAttribute("y1", y1);
  line.setAttribute("x2", x2);
  line.setAttribute("y2", y2);
  line.setAttribute("class", major ? "major" : "");
  ticksGroup.appendChild(line);
}

// Tick sound (Web Audio)
let audioCtx;
function playTick() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = 1800 + Math.random() * 200;
    osc.type = "square";
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.03);
  } catch (e) {}
}

function updateUI() {
  const m = modes[currentMode];
  const v = values[currentMode];
  let display = v.toFixed(m.decimals) + m.unit;
  if (currentMode === "LOOP" && v === 0) display = "∞";
  valueText.textContent = display;

  const parts = ["SPEED", "VOICE", "EQ", "LOOP", "REPS", "VOLUME"];
  modeLabel.innerHTML = parts.map(p => 
    p === currentMode ? `<span>${p}</span>` : p
  ).join(" · ");

  document.querySelectorAll(".icon").forEach(el => {
    el.classList.toggle("active", el.dataset.mode === currentMode);
  });
}

function setAngle(a) {
  angle = a;
  rotator.setAttribute("transform", `rotate(${a} 160 160)`);
}

function getAngleFromEvent(e) {
  const rect = dial.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return Math.atan2(clientY - cy, clientX - cx) * 180 / Math.PI;
}

function onStart(e) {
  e.preventDefault();
  isDragging = true;
  lastAngle = getAngleFromEvent(e);
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}

function onMove(e) {
  if (!isDragging) return;
  e.preventDefault();
  const current = getAngleFromEvent(e);
  let delta = current - lastAngle;
  if (delta > 180) delta -= 360;
  if (delta < -180) delta += 360;
  lastAngle = current;

  angle += delta;
  setAngle(angle);

  const m = modes[currentMode];
  const sensitivity = 2.2;
  const steps = Math.round(delta / sensitivity);
  if (steps !== 0) {
    let newVal = values[currentMode] + steps * m.step;
    newVal = Math.max(m.min, Math.min(m.max, newVal));
    if (newVal !== values[currentMode]) {
      values[currentMode] = newVal;
      updateUI();
      playTick();
      if (navigator.vibrate) navigator.vibrate(9);
    }
  }
}

function onEnd() {
  isDragging = false;
}

dial.addEventListener("pointerdown", onStart);
window.addEventListener("pointermove", onMove);
window.addEventListener("pointerup", onEnd);
window.addEventListener("pointercancel", onEnd);

dial.addEventListener("touchstart", onStart, { passive: false });
window.addEventListener("touchmove", onMove, { passive: false });
window.addEventListener("touchend", onEnd);

document.querySelectorAll(".icon").forEach(el => {
  el.addEventListener("click", () => {
    currentMode = el.dataset.mode;
    updateUI();
    playTick();
    if (navigator.vibrate) navigator.vibrate(14);
  });
});

updateUI();
setAngle(0);
</script>
</body>
</html>
