<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Music Player Settings</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .phone {
    max-width: 390px;
    margin: 0 auto;
    min-height: 100vh;
    background: #0d1117;
    position: relative;
    padding-bottom: 40px;
  }
  .header {
    padding: 18px 20px 8px;
    display: flex;
    align-items: center;
  }
  .back {
    font-size: 24px;
    color: #e6edf3;
    background: none;
    border: none;
    cursor: pointer;
  }
  .dial-section {
    position: relative;
    height: 280px;
    margin: 10px 0 20px;
    padding: 0 20px;
  }
  .arc-wrap {
    position: absolute;
    left: 10px;
    top: 0;
    width: 260px;
    height: 260px;
  }
  svg.arc {
    width: 100%;
    height: 100%;
  }
  .time-big {
    position: absolute;
    left: 28px;
    top: 95px;
    font-size: 72px;
    font-weight: 300;
    letter-spacing: -2px;
    line-height: 1;
  }
  .time-pill {
    position: absolute;
    left: 130px;
    top: 118px;
    background: transparent;
    border: 1.5px solid #8b949e;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 22px;
    font-weight: 400;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .time-pill span {
    opacity: 0.7;
    font-size: 16px;
  }
  .date-box {
    position: absolute;
    right: 24px;
    top: 110px;
    text-align: right;
    font-size: 13px;
    letter-spacing: 1px;
    color: #8b949e;
    line-height: 1.5;
  }
  .date-box .day {
    margin-top: 4px;
    border-top: 1px solid #30363d;
    padding-top: 6px;
    font-size: 12px;
  }
  .section-title {
    padding: 0 24px 16px;
    font-size: 12px;
    letter-spacing: 1.5px;
    color: #8b949e;
    text-transform: uppercase;
  }
  .settings-list {
    padding: 0 16px;
  }
  .setting-item {
    display: flex;
    align-items: center;
    padding: 14px 8px;
    border-bottom: 1px solid #21262d;
    cursor: pointer;
    transition: background 0.15s;
  }
  .setting-item:active {
    background: #161b22;
  }
  .setting-item .icon {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 14px;
    opacity: 0.9;
  }
  .setting-item .icon svg {
    width: 20px;
    height: 20px;
    stroke: #e6edf3;
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .setting-item .label {
    flex: 1;
    font-size: 15px;
    font-weight: 400;
  }
  .setting-item .value {
    font-size: 14px;
    color: #8b949e;
    margin-right: 8px;
  }
  .setting-item .chevron {
    color: #8b949e;
    font-size: 16px;
  }
  .toggle {
    width: 44px;
    height: 26px;
    background: #30363d;
    border-radius: 999px;
    position: relative;
    transition: background 0.2s;
  }
  .toggle.on {
    background: #e6edf3;
  }
  .toggle::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    background: #0d1117;
    border-radius: 50%;
    top: 3px;
    left: 3px;
    transition: transform 0.2s;
  }
  .toggle.on::after {
    transform: translateX(18px);
    background: #0d1117;
  }
  .now-playing {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 40px);
    max-width: 350px;
    background: #161b22;
    border-radius: 16px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .now-playing .art {
    width: 42px;
    height: 42px;
    background: #0d1117;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }
  .now-playing .info {
    flex: 1;
  }
  .now-playing .title {
    font-size: 14px;
    font-weight: 500;
  }
  .now-playing .artist {
    font-size: 12px;
    color: #8b949e;
  }
  .now-playing .controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .now-playing .controls button {
    background: none;
    border: none;
    color: #e6edf3;
    font-size: 18px;
    cursor: pointer;
  }
  .battery {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #8b949e;
  }
  /* Expanded state */
  .expanded .dial-section { display: none; }
  .expanded .section-title { padding-top: 12px; }
</style>
</head>
<body>
<div class="phone" id="app">
  <div class="header">
    <button class="back" id="backBtn">←</button>
  </div>

  <div class="dial-section" id="dialSection">
    <div class="arc-wrap">
      <svg class="arc" viewBox="0 0 260 260">
        <!-- Arc ticks and numbers will be drawn by JS -->
        <g id="arcTicks"></g>
      </svg>
    </div>
    <div class="time-big" id="hourDisplay">05</div>
    <div class="time-pill">
      <span id="minDisplay">38</span>
      <span>|</span>
      <span>AM</span>
    </div>
    <div class="date-box">
      22 AUG 2025
      <div class="day">FRIDAY</div>
    </div>
  </div>

  <div class="section-title">MUSIC PLAYER SETTINGS</div>

  <div class="settings-list" id="settingsList">
    <!-- Items populated by JS -->
  </div>

  <div class="now-playing" id="nowPlaying" style="display:none;">
    <div class="art">🌙</div>
    <div class="info">
      <div class="title">DREAM STATE</div>
      <div class="artist">AURORA</div>
    </div>
    <div class="controls">
      <button>⏮</button>
      <button>⏸</button>
      <button>⏭</button>
    </div>
  </div>

  <div class="battery">🔋 52%</div>
</div>

<script>
const settings = [
  { icon: 'eq', label: 'EQUALIZER', value: 'NORMAL', type: 'link' },
  { icon: 'quality', label: 'AUDIO QUALITY', value: 'HIGH', type: 'link' },
  { icon: 'speed', label: 'PLAYBACK SPEED', value: 'NORMAL', type: 'link' },
  { icon: 'crossfade', label: 'CROSSFADE', value: '5 SEC', type: 'link' },
  { icon: 'timer', label: 'SLEEP TIMER', value: 'OFF', type: 'link' },
  { icon: 'view', label: 'NOW PLAYING VIEW', value: 'CLASSIC', type: 'link' },
  { icon: 'bass', label: 'BASS BOOST', value: true, type: 'toggle' },
  { icon: 'download', label: 'DOWNLOAD ONLY', value: false, type: 'toggle' },
  { icon: 'playlist', label: 'PLAYLIST VIEW', value: 'CLASSIC', type: 'link' },
  { icon: 'now', label: 'NOW PLAYING', value: 'ON', type: 'link' },
  { icon: 'more', label: 'ADDITIONAL SETTINGS', value: '', type: 'link' }
];

const icons = {
  eq: '<path d="M4 12v6M8 8v10M12 4v14M16 10v8M20 6v12"/>',
  quality: '<path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0"/><path d="M12 8v4l3 2"/>',
  speed: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  crossfade: '<path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
  timer: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  view: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  bass: '<path d="M2 12h4l3-9 4 18 3-9h4"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  playlist: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  now: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>'
};

function renderList(full = false) {
  const list = document.getElementById('settingsList');
  const items = full ? settings : settings.slice(0, 6);
  list.innerHTML = items.map((s, i) => {
    const iconSvg = `<svg viewBox="0 0 24 24">${icons[s.icon] || ''}</svg>`;
    if (s.type === 'toggle') {
      return `
        <div class="setting-item" data-idx="${i}">
          <div class="icon">${iconSvg}</div>
          <div class="label">${s.label}</div>
          <div class="toggle ${s.value ? 'on' : ''}" data-toggle="${i}"></div>
        </div>`;
    }
    return `
      <div class="setting-item" data-idx="${i}">
        <div class="icon">${iconSvg}</div>
        <div class="label">${s.label}</div>
        <div class="value">${s.value}</div>
        <div class="chevron">></div>
      </div>`;
  }).join('');

  // Toggle handlers
  document.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      el.classList.toggle('on');
    });
  });
}

// Draw arc
function drawArc() {
  const g = document.getElementById('arcTicks');
  const cx = 130, cy = 130, r = 105;
  const startAngle = -200 * Math.PI / 180;
  const endAngle = 20 * Math.PI / 180;
  const total = endAngle - startAngle;

  // Numbers positions approx matching image
  const nums = [
    {v:60, a:-160}, {v:55, a:-140}, {v:50, a:-120}, {v:45, a:-95},
    {v:40, a:-70}, {v:35, a:-40}, {v:30, a:-10}, {v:25, a:15},
    {v:20, a:40}, {v:15, a:70}
  ];

  // Ticks
  for (let i = 0; i <= 48; i++) {
    const t = i / 48;
    const a = startAngle + t * total;
    const major = i % 4 === 0;
    const r1 = major ? r - 14 : r - 8;
    const r2 = r;
    const x1 = cx + Math.cos(a) * r1;
    const y1 = cy + Math.sin(a) * r1;
    const x2 = cx + Math.cos(a) * r2;
    const y2 = cy + Math.sin(a) * r2;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', major ? '#8b949e' : '#30363d');
    line.setAttribute('stroke-width', major ? 1.8 : 1.2);
    g.appendChild(line);
  }

  // Numbers
  nums.forEach(n => {
    const a = n.a * Math.PI / 180;
    const x = cx + Math.cos(a) * (r - 28);
    const y = cy + Math.sin(a) * (r - 28);
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', x);
    text.setAttribute('y', y);
    text.setAttribute('fill', '#e6edf3');
    text.setAttribute('font-size', '14');
    text.setAttribute('font-weight', '300');
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'middle');
    text.textContent = n.v;
    g.appendChild(text);
  });
}

// Simple expand toggle for demo
let expanded = false;
document.getElementById('backBtn').addEventListener('click', () => {
  // just visual for now
});

// Make list expandable by long press or button (for demo we add click on title)
document.querySelector('.section-title').addEventListener('click', () => {
  expanded = !expanded;
  document.getElementById('app').classList.toggle('expanded', expanded);
  renderList(expanded);
  document.getElementById('nowPlaying').style.display = expanded ? 'flex' : 'none';
});

drawArc();
renderList(false);
</script>
</body>
</html>
